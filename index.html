<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vampera - تطبيق الدردشة الذكي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body id="bodyTheme" class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-red-900/40 p-8 rounded-2xl w-full max-w-md shadow-2xl text-center">
            <h1 class="text-3xl font-bold text-red-500 mb-2">Vampera 🧛‍♂️</h1>
            <p class="text-slate-400 mb-6">أدخل اسمك للانضمام إلى عالم الدردشة والمتعة</p>
            <input type="text" id="usernameInput" placeholder="اكتب اسم المستعار هنا..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 mb-4 text-white focus:outline-none focus:border-red-500">
            <button onclick="login()" class="w-full bg-red-600 hover:bg-red-700 font-bold py-3 rounded-xl transition duration-200">دخول إلى التطبيق</button>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="appScreen" class="hidden flex-1 flex flex-col h-full">
        <!-- شريط علوي -->
        <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-xl font-bold text-red-500">Vampera</span>
                <span id="currentRoomTitle" class="text-xs bg-red-950 text-red-300 px-2.5 py-1 rounded-full border border-red-900">الدردشة العامة</span>
            </div>
            
            <!-- أزرار التنقل والثيمات -->
            <div class="flex items-center gap-2">
                <button onclick="switchTab('chat')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-sm rounded-lg">💬 الشات</button>
                <button onclick="switchTab('ai')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-sm rounded-lg">🤖 بوت AI</button>
                <button onclick="switchTab('game')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-sm rounded-lg">🎮 لعبة</button>
                
                <!-- تبديل الثيم -->
                <select onchange="changeTheme(this.value)" class="bg-slate-800 text-xs px-2 py-1.5 rounded-lg border border-slate-700 focus:outline-none">
                    <option value="red">🧛‍♂️ فامبير (أحمر)</option>
                    <option value="purple">🔮 ليلكي فخم</option>
                    <option value="blue">⚡ أزرق نيون</option>
                </select>
            </div>
        </header>

        <!-- محتوى التطبيق -->
        <main class="flex-1 overflow-y-auto p-4 flex flex-col">
            
            <!-- قسم الشات العام -->
            <div id="tab-chat" class="flex-1 flex flex-col h-full">
                <div id="chatMessages" class="flex-1 overflow-y-auto space-y-3 mb-4 pr-2">
                    <!-- الرسائل تظهر هنا -->
                </div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" onkeypress="handleKey(event, 'chat')" placeholder="اكتب رسالة..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500">
                    <button onclick="sendChatMessage()" class="bg-red-600 hover:bg-red-700 px-5 rounded-xl font-bold text-sm">إرسال</button>
                </div>
            </div>

            <!-- قسم بوت الـ AI -->
            <div id="tab-ai" class="hidden flex-1 flex flex-col h-full">
                <div id="aiMessages" class="flex-1 overflow-y-auto space-y-3 mb-4 pr-2">
                    <div class="bg-slate-900 p-3 rounded-xl max-w-[80%] border border-slate-800">
                        <span class="text-xs text-red-400 block font-bold mb-1">🤖 Vampera AI</span>
                        أهلاً بك! أنا بوت الذكاء الاصطناعي الخاص بك، اسألني ما شئت لنملأ وقت الفراغ!
                    </div>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="aiInput" onkeypress="handleKey(event, 'ai')" placeholder="دردش مع البوت..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500">
                    <button onclick="sendAIMessage()" class="bg-red-600 hover:bg-red-700 px-5 rounded-xl font-bold text-sm">إرسال</button>
                </div>
            </div>

            <!-- قسم الألعاب (لعبة تخمين الرقم) -->
            <div id="tab-game" class="hidden flex-1 flex flex-col items-center justify-center text-center p-4">
                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 max-w-sm w-full shadow-xl">
                    <h2 class="text-xl font-bold text-red-500 mb-2">🎮 لعبة تخمين الرقم</h2>
                    <p class="text-sm text-slate-400 mb-4">لقد اخترت رقماً بين 1 و 10. حاول تخمينه!</p>
                    <input type="number" id="gameGuess" min="1" max="10" placeholder="أدخل رقماً..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 mb-3 text-center text-white focus:outline-none">
                    <button onclick="checkGame()" class="w-full bg-red-600 hover:bg-red-700 py-2.5 rounded-xl font-bold text-sm mb-3">تحقق من الإجابة</button>
                    <p id="gameResult" class="text-sm font-semibold text-slate-300"></p>
                </div>
            </div>

        </main>
    </div>

    <!-- كود الجافاسكريبت لتشغيل كل الوظائف -->
    <script>
        let currentUser = "";
        let secretNum = Math.floor(Math.random() * 10) + 1;

        function login() {
            const input = document.getElementById("usernameInput").value.trim();
            if(!input) {
                alert("الرجاء كتابة اسم صالح!");
                return;
            }
            currentUser = input;
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("appScreen").classList.remove("hidden");
            loadMessages();
        }

        function switchTab(tabName) {
            document.getElementById("tab-chat").classList.add("hidden");
            document.getElementById("tab-ai").classList.add("hidden");
            document.getElementById("tab-game").classList.add("hidden");
            document.getElementById("tab-" + tabName).classList.remove("hidden");
        }

        // ثيمات الألوان
        function changeTheme(theme) {
            const body = document.getElementById("bodyTheme");
            if(theme === 'red') body.className = "bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden";
            if(theme === 'purple') body.className = "bg-purple-950 text-purple-100 h-screen flex flex-col overflow-hidden";
            if(theme === 'blue') body.className = "bg-blue-950 text-blue-100 h-screen flex flex-col overflow-hidden";
        }

        // إدارة الشات العام
        function loadMessages() {
            const msgs = JSON.parse(localStorage.getItem("vampera_msgs") || "[]");
            const container = document.getElementById("chatMessages");
            container.innerHTML = "";
            msgs.forEach(m => {
                container.innerHTML += `<div class="bg-slate-900 p-3 rounded-xl max-w-[80%] border border-slate-800"><span class="text-xs text-red-400 block font-bold mb-1">${m.user}</span>${m.text}</div>`;
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById("chatInput");
            const text = input.value.trim();
            if(!text) return;

            let msgs = JSON.parse(localStorage.getItem("vampera_msgs") || "[]");
            msgs.push({ user: currentUser, text: text });
            localStorage.setItem("vampera_msgs", JSON.stringify(msgs));
            input.value = "";
            loadMessages();
        }

        // بوت الذكاء الاصطناعي التجريبي
        function sendAIMessage() {
            const input = document.getElementById("aiInput");
            const text = input.value.trim();
            if(!text) return;

            const container = document.getElementById("aiMessages");
            container.innerHTML += `<div class="bg-slate-800 p-3 rounded-xl max-w-[80%] ml-auto text-left"><span class="text-xs text-blue-400 block font-bold mb-1">أنت</span>${text}</div>`;
            input.value = "";

            setTimeout(() => {
                const replies = [
                    "فكرة ممتازة! واصل العمل عليها.",
                    "ههه حقاً؟ أخبرني بالمزيد.",
                    "أنا هنا دائماً لكي لا تحس بالملل!",
                    "هذا رائع يا صديقي، هل جربت اللعبة في القسم الآخر؟"
                ];
                const reply = replies[Math.floor(Math.random() * replies.length)];
                container.innerHTML += `<div class="bg-slate-900 p-3 rounded-xl max-w-[80%] border border-slate-800"><span class="text-xs text-red-400 block font-bold mb-1">🤖 Vampera AI</span>${reply}</div>`;
                container.scrollTop = container.scrollHeight;
            }, 600);
        }

        // لعبة تخمين الرقم
        function checkGame() {
            const guess = parseInt(document.getElementById("gameGuess").value);
            const res = document.getElementById("gameResult");
            if(guess === secretNum) {
                res.className = "text-sm font-semibold text-green-400";
                res.innerHTML = "🎉 مبروك! لقد خمنت الرقم الصحيح بنجاح!";
                secretNum = Math.floor(Math.random() * 10) + 1; // إعادة توليد رقم جديد
            } else if(guess > secretNum) {
                res.className = "text-sm font-semibold text-yellow-400";
                res.innerHTML = "📉 الرقم أصغر من هذا، حاول مرة أخرى!";
            } else {
                res.className = "text-sm font-semibold text-yellow-400";
                res.innerHTML = "📈 الرقم أكبر من هذا، حاول مرة أخرى!";
            }
        }

        function handleKey(e, type) {
            if(e.key === 'Enter') {
                if(type === 'chat') sendChatMessage();
                if(type === 'ai') sendAIMessage();
            }
        }
    </script>
</body>
</html>
